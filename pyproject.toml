[project]
name = "pycli-wordstat"
version = "0.1.0"
description = "Sub-optimal word-frequency CLI, used as an AI-refactor teaching example."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wordstat = "pycli.wordstat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycli"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pyink>=24.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pycli --cov-report=term-missing --cov-report=xml --cov-fail-under=100"

[tool.coverage.run]
source = ["src/pycli"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "D", "N", "I"]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.pyink]
line-length = 80
pyink-indentation = 4
