name: ci

on:
  # branches: ['**'] matches every branch (including your own feature
  # branches) but not tags -- a bare `push:` with no filter also fires
  # on the tags changelog-release.yml creates, which would be a
  # redundant, pointless CI run on every release.
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff, Google docstring convention)
        run: uv run ruff check src tests

      - name: Test with 100% coverage gate
        run: uv run pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
